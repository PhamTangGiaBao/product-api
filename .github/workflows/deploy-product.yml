
name: Product API Deploy

on:
  workflow_run:
    workflows: ["Product API CD"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest Docker image
        run: docker compose -f docker-compose-prod.yaml pull product-api

      - name: Deploy containers
        run: docker compose -f docker-compose-prod.yaml up -d --remove-orphans

      - name: Health check
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:3000/health; then
              echo "Deploy health check: PASSED"
              exit 0
            fi
            sleep 2
          done
          echo "Deploy health check: FAILED"
          docker compose -f docker-compose-prod.yaml logs --tail 50
          exit 1
